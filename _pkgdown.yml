    contents:
      - distance_choices
      - default_distance
      - compute_distance
      - tree_choices
      - build_tree
      - cophenetic_cor
      - cophenetic_table
  - title: Checking the tree
    contents:
      - bootstrap_tree
      - consensus_tree
      - optimal_k
      - silhouette_meaning
      - mantel_test
      - read_second_matrix
      - metadata_distance
