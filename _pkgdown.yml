url: https://ebenogoe.github.io/clusnalyst/
template:
  bootstrap: 5
  bslib:
    primary: "#5b3fd6"
    base_font: {google: "Plus Jakarta Sans"}
    code_font: {google: "JetBrains Mono"}
    bg: "#ffffff"
    fg: "#2d2a45"
navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
reference:
